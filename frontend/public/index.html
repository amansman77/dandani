<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Dandani - 감정적으로 단단해지는 연습"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" />
    <style>
      /* 서비스 기본 폰트: 프리텐다드. CDN 의존 없이 정적 파일로 직접 서빙(가변 폰트
         1개 파일로 100~900 굵기를 다 커버). Noto Serif KR/나눔명조는 프리텐다드가
         어떤 이유로든 못 불러와질 때를 대비한 폴백으로 계속 로드해둔다. */
      @font-face {
        font-family: 'Pretendard';
        src: url('%PUBLIC_URL%/fonts/PretendardVariable.woff2') format('woff2-variations');
        font-weight: 45 920;
        font-style: normal;
        font-display: swap;
      }
      /* font-family / word-break / overflow-wrap은 전부 상속되는 속성이라
         body 한 곳에만 걸면 하위 전체(MUI가 body 밑에 따로 띄우는 Dialog·
         Drawer 포털 포함)에 그대로 내려간다. 예전엔 여기가 `*` 전체 선택자에
         !important였는데, 그러면 컴포넌트가 폰트를 지정할 때마다 똑같이
         !important를 붙여야만 먹히는 구조가 돼서(코드에 !important가 13개
         생긴 원인) 상속 방식으로 바꿨다. 실제 폰트 지정은 MUI 테마
         (src/theme/tokens.js)가 하고, 여기 body 규칙은 React가 붙기 전
         잠깐 보이는 화면(noscript 등)을 위한 기본값이다. */
      body {
        font-family: 'Pretendard', 'Noto Serif KR', serif;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
    </style>
    <!-- Google tag (gtag.js) -->

      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DE4BQNRB4G');
    </script>
    <title>Dandani</title>
  </head>
