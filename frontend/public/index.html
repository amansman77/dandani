    <link rel="icon" href="%PUBLIC_URL%/favicon/favicon.ico" />

    <!-- 모바일 브라우저 상단 바 색. 검정으로 박혀 있었는데 앱 배경과 안 맞았다 -->

    <!-- 카카오톡·트위터 등에 링크를 붙였을 때 뜨는 미리보기.
         크롤러는 JS를 실행하지 않으므로 여기 정적으로 있어야 한다.
         og:image는 반드시 절대 URL이어야 해서 %PUBLIC_URL%을 못 쓴다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="단단이" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://dandani.yetimates.com/" />
    <meta property="og:title" content="단단이 — 매일 아침, 한 문장" />

    <meta property="og:image" content="https://dandani.yetimates.com/og-image.png" />

    <meta property="og:image:alt" content="단단이 — 매일 아침, 나에게 하고 싶은 말 한 문장을 적어보세요." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="단단이 — 매일 아침, 한 문장" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <style>
      /* 서비스 기본 폰트: 프리텐다드. CDN 의존 없이 정적 파일로 직접 서빙(가변 폰트
         1개 파일로 100~900 굵기를 다 커버).
         예전엔 폴백용으로 구글 폰트(Noto Serif KR + 나눔명조)를 같이 링크했는데,
         프로덕션에서 재보니 그 요청이 등록하는 @font-face 약 600개가 전부
         `unloaded` — 한 글자도 안 쓰이면서 렌더 블로킹 외부 요청만 매 방문
         발생시키고 있었다. 프리텐다드를 자체 호스팅하는 이상 폴백은 기기에
         이미 있는 시스템 한글 폰트로 충분해서 링크를 걷어냈다. */
      @font-face {
        font-family: 'Pretendard';
        src: url('%PUBLIC_URL%/fonts/PretendardVariable.woff2') format('woff2-variations');
        font-weight: 45 920;
        font-style: normal;
        font-display: swap;
      }
      /* font-family / word-break / overflow-wrap은 전부 상속되는 속성이라
         body 한 곳에만 걸면 하위 전체(MUI가 body 밑에 따로 띄우는 Dialog·
         Drawer 포털 포함)에 그대로 내려간다. 예전엔 여기가 `*` 전체 선택자에
         !important였는데, 그러면 컴포넌트가 폰트를 지정할 때마다 똑같이
         !important를 붙여야만 먹히는 구조가 돼서(코드에 !important가 13개
         생긴 원인) 상속 방식으로 바꿨다. 실제 폰트 지정은 MUI 테마
         (src/theme/tokens.js)가 하고, 여기 body 규칙은 React가 붙기 전
         잠깐 보이는 화면(noscript 등)을 위한 기본값이다. */
      body {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        word-break: keep-all;
        overflow-wrap: break-word;
        /* 배경 그라디언트를 화면 고정 레이어로 옮기면서, 그 레이어가 못 덮는 곳
           (iOS의 안전영역, 스크롤 끝에서 튕길 때 생기는 여백)이 브라우저 기본
           흰색으로 드러났다 — 하단 탭 자리가 흰 띠로 보이고 화면이 잘린 것처럼
           보이던 원인. 문서 자체에도 같은 그라디언트를 깔아두면 그 틈에 흰색
           대신 위쪽은 새벽색, 아래쪽은 크림색이 이어진다. */
        background-color: #f8f1e6;
        background-image: linear-gradient(180deg, #eef2f4 0%, #f3ece2 55%, #f8f1e6 100%);
      }
    </style>
